<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24" role="img" aria-label="Divider">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="15%" stop-color="#7c3aed" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ff2bd6" stop-opacity="1"/>
      <stop offset="85%" stop-color="#bf5af2" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="subtle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d0221" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0d0221" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Subtle glow background line -->
  <line x1="100" y1="12" x2="1100" y2="12" stroke="url(#subtle)" stroke-width="6"/>
  <!-- Main glowing gradient line -->
  <line x1="50" y1="12" x2="1150" y2="12" stroke="url(#g)" stroke-width="2" filter="url(#glow)"/>
  <line x1="250" y1="12" x2="950" y2="12" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
  <!-- Center tech accent -->
  <polygon points="600,6 606,12 600,18 594,12" fill="#ff2bd6" filter="url(#glow)"/>
  <polygon points="600,8 604,12 600,16 596,12" fill="#ffffff"/>
  <!-- Accent nodes -->
  <circle cx="560" cy="12" r="2.5" fill="#bf5af2" opacity="0.9"/>
  <circle cx="640" cy="12" r="2.5" fill="#bf5af2" opacity="0.9"/>
  <circle cx="530" cy="12" r="1.5" fill="#7c3aed" opacity="0.7"/>
  <circle cx="670" cy="12" r="1.5" fill="#7c3aed" opacity="0.7"/>
</svg>
