<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 68" width="320" height="68" role="img" aria-label="Buy Me A Coffee">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e0224"/>
      <stop offset="100%" stop-color="#1b0645"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#bf5af2"/>
      <stop offset="100%" stop-color="#ff2bd6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Button Card Container with glowing gradient border -->
  <rect x="2" y="2" width="316" height="64" rx="32" fill="url(#bg)"/>
  <rect x="2" y="2" width="316" height="64" rx="32" fill="none" stroke="url(#g)" stroke-width="2" filter="url(#glow)"/>
  <rect x="2" y="2" width="316" height="64" rx="32" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Coffee Cup Group -->
  <g transform="translate(26, 14)">
    <!-- Steam Line 1 -->
    <path d="M10,13 Q7,8 10,4 Q13,0 10,-4" fill="none" stroke="#bf5af2" stroke-width="1.8" stroke-linecap="round">
      <animate attributeName="transform" type="translate" values="0,0; -1,-6; 0,-12" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 0.9; 0" dur="2s" repeatCount="indefinite"/>
    </path>
    <!-- Steam Line 2 (center) -->
    <path d="M17,13 Q14,8 17,4 Q20,0 17,-4" fill="none" stroke="#ff2bd6" stroke-width="1.8" stroke-linecap="round">
      <animate attributeName="transform" type="translate" values="0,0; 1,-6; 0,-12" dur="2s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 0.95; 0" dur="2s" begin="0.7s" repeatCount="indefinite"/>
    </path>
    <!-- Steam Line 3 -->
    <path d="M24,13 Q21,8 24,4 Q27,0 24,-4" fill="none" stroke="#bf5af2" stroke-width="1.8" stroke-linecap="round">
      <animate attributeName="transform" type="translate" values="0,0; -1,-6; 0,-12" dur="2s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0; 0.9; 0" dur="2s" begin="1.3s" repeatCount="indefinite"/>
    </path>

    <!-- Cup Body -->
    <path d="M5,16 L29,16 C29,29 25,32 17,32 C9,32 5,29 5,16 Z" fill="url(#g)"/>
    <ellipse cx="17" cy="16" rx="12" ry="3.5" fill="#2d0a5e"/>
    <!-- Coffee liquid reflection -->
    <ellipse cx="17" cy="16.5" rx="9" ry="2" fill="#ff2bd6" opacity="0.6"/>
    <!-- Cup Handle -->
    <path d="M28,19 C33,19 35,21 35,24 C35,27 32,29 27,29" fill="none" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Saucer -->
    <path d="M2,35 L32,35" stroke="#bf5af2" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Button Text -->
  <text x="82" y="38" font-family="'Consolas', 'Fira Code', 'Segoe UI', monospace" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="1.5">
    BUY ME A COFFEE
  </text>
  <text x="82" y="52" font-family="'Consolas', 'Fira Code', 'Segoe UI', monospace" font-size="10" font-weight="600" fill="#bf5af2" letter-spacing="1">
    FUEL THE NEXT BUILD ⚡
  </text>
</svg>
