  <text x="600" y="28" text-anchor="middle" font-family="'Consolas', 'Fira Code', monospace" font-size="13" font-weight="600" fill="#c9b8ff" letter-spacing="1">dhruv.profile.js — node</text>
  <line x1="1" y1="45" x2="1199" y2="45" stroke="#7c3aed" stroke-opacity="0.28" stroke-width="1"/>

