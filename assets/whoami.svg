    <text x="82" y="265" class="code-text" xml:space="preserve">  <tspan fill="#38bdf8">ask_me  </tspan> <tspan fill="#bf5af2">:</tspan> <tspan fill="#c9b8ff">[</tspan><tspan fill="#a7f3d0">"Python"</tspan><tspan fill="#c9b8ff">, </tspan><tspan fill="#a7f3d0">"C"</tspan><tspan fill="#c9b8ff">, </tspan><tspan fill="#a7f3d0">"Java"</tspan><tspan fill="#c9b8ff">, </tspan><tspan fill="#a7f3d0">"React"</tspan><tspan fill="#c9b8ff">, </tspan><tspan fill="#a7f3d0">"Flask"</tspan><tspan fill="#c9b8ff">],</tspan></text>
  </g>
